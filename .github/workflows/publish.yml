on:
  push:
    branches: [main]
  workflow_dispatch: {}

name: Render and publish book

# The book is the repository root. Do not reintroduce a
# `working-directory: people-analytics-book` — no such directory exists here,
# and the path filter that went with it meant this workflow never triggered.

concurrency:
  group: publish
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install R package dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # Hard dependencies only (Depends/Imports/LinkingTo). The default
          # ("all") pulls Suggests too, and brms suggests cmdstanr, which is not
          # on CRAN — pak can't resolve it and the whole solve fails. The book
          # uses brms's default rstan backend, so cmdstanr is never needed.
          dependencies: '"hard"'
          extra-packages: |
            tidyverse
            rstanarm
            brms
            tidybayes
            bayesplot
            skimr
            peopleanalyticsdata

      # _freeze is committed, so only chapters whose source changed re-execute.
      - name: Render book
        run: quarto render

      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs
          # Rebuild gh-pages from scratch each time. Without this, files deleted
          # from the book linger on the live site forever — which is how 99 stale
          # iCloud conflict copies ended up published.
          force_orphan: true
