<text x="76" y="146" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" font-style="normal" fill="#122a52" text-anchor="middle">manager?</text>
<text x="176.27042743878158" y="159.3670749796098" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" font-style="normal" fill="#122a52" text-anchor="middle">Yes</text>
<text x="230.62031707822646" y="193.28771087150045" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" font-style="normal" fill="#122a52" text-anchor="middle">No</text>
<text x="286" y="68" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" font-style="normal" fill="#3d68a8" text-anchor="middle">4,000 draws,</text>
<text x="286" y="82" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" font-style="normal" fill="#3d68a8" text-anchor="middle">not three branches</text>
<text x="76" y="336" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" font-style="normal" fill="#8a5a00" text-anchor="start">Each path multiplies one draw from each of:</text>
<text x="88" y="358" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" font-style="normal" fill="#122a52" text-anchor="start">• the manager’s transfer rate</text>
<text x="330" y="358" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" font-style="italic" fill="#3d68a8" text-anchor="start">(posterior)</text>
<text x="88" y="377" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" font-style="normal" fill="#122a52" text-anchor="start">• the reduction coaching achieves</text>
<text x="330" y="377" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" font-style="italic" fill="#3d68a8" text-anchor="start">(elicited)</text>
<text x="88" y="396" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" font-style="normal" fill="#122a52" text-anchor="start">• the net cost of one departure</text>
<text x="330" y="396" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" font-style="italic" fill="#3d68a8" text-anchor="start">(elicited)</text>
