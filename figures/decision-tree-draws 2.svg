<text x="590" y="44" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" font-style="normal" fill="#122a52" text-anchor="start">A posterior for net benefit,</text>
<text x="590" y="60" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" font-style="normal" fill="#122a52" text-anchor="start">not a single expected value</text>
<text x="590" y="196" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" font-style="italic" fill="#3d68a8" text-anchor="start">Read it for how often coaching pays,</text>
<text x="590" y="212" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" font-style="italic" fill="#3d68a8" text-anchor="start">and how badly it doesn’t</text>
<text x="580" y="290" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" font-style="normal" fill="#122a52" text-anchor="start">Nothing changes, nothing spent: £0</text>
