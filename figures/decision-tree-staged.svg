<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 380" width="1010" height="380" role="img">
<title>A staged decision: pilot first, keep the right to stop</title>
<path d="M 103 200 L 628 330" fill="none" stroke="#122a52" stroke-width="2" stroke-opacity="1.0"/>
<path d="M 103 200 L 277 120" fill="none" stroke="#122a52" stroke-width="2" stroke-opacity="1.0"/>
<path d="M 303 120 L 457 60" fill="none" stroke="#122a52" stroke-width="2" stroke-opacity="1.0"/>
<path d="M 303 120 L 457 170" fill="none" stroke="#122a52" stroke-width="2" stroke-opacity="1.0"/>
<path d="M 483 60 L 628 60" fill="none" stroke="#122a52" stroke-width="2" stroke-opacity="1.0"/>
<path d="M 483 170 L 628 170" fill="none" stroke="#b8bcc4" stroke-width="2" stroke-opacity="1.0" stroke-dasharray="5 4"/>
<rect x="77" y="187" width="26" height="26" rx="2" fill="#122a52"/>
<circle cx="290" cy="120" r="13" fill="none" stroke="#122a52" stroke-width="2.5"/>
<rect x="457" y="47" width="26" height="26" rx="2" fill="#122a52"/>
<rect x="457" y="157" width="26" height="26" rx="2" fill="#122a52"/>
<polygon points="628,48 652,60 628,72" fill="#3d68a8"/>
<polygon points="628,158 652,170 628,182" fill="#3d68a8"/>
<polygon points="628,318 652,330 628,342" fill="#3d68a8"/>
<text x="90" y="160" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" font-style="normal" fill="#122a52" text-anchor="middle">How much do</text>
<text x="90" y="176" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" font-style="normal" fill="#122a52" text-anchor="middle">we commit?</text>
<text x="183.31626861389725" y="149.46288423522654" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" font-style="normal" fill="#122a52" text-anchor="middle">Pilot 30 managers</text>
<text x="329.50899533658765" y="234.33290344839605" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" font-style="normal" fill="#122a52" text-anchor="middle">Commit the whole budget now</text>
<text x="290" y="66" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" font-style="normal" fill="#3d68a8" text-anchor="middle">What the</text>
<text x="290" y="80" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" font-style="normal" fill="#3d68a8" text-anchor="middle">pilot shows</text>
<text x="396.8406080146198" y="73.48689390419082" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" font-style="normal" fill="#8a5a00" text-anchor="middle">It works</text>
<text x="397.5455121998151" y="168.3646224245695" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" font-style="normal" fill="#8a5a00" text-anchor="middle">It doesn’t</text>
<text x="660" y="64" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" font-style="normal" fill="#122a52" text-anchor="start">Roll out to everyone — keep the upside</text>
<text x="660" y="174" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" font-style="normal" fill="#122a52" text-anchor="start">Stop — the downside is truncated here</text>
<text x="660" y="334" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" font-style="normal" fill="#122a52" text-anchor="start">Whatever happens, happens</text>
<text x="660" y="350" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" font-style="italic" fill="#3d68a8" text-anchor="start">no second chance to choose</text>
<text x="660" y="250" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" font-style="normal" fill="#8a5a00" text-anchor="start">The option lives in this second square.</text>
<text x="660" y="268" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" font-style="normal" fill="#8a5a00" text-anchor="start">Remove it — no probation, no way to stop —</text>
<text x="660" y="286" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" font-style="normal" fill="#8a5a00" text-anchor="start">and the top branch collapses onto the bottom.</text>
</svg>
